version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: madrasaos/ai-platform:3.0.0
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-madrasa_admin}:${POSTGRES_PASSWORD:-MadrasaSecure2026!}@postgres:5432/${POSTGRES_DB:-madrasaos_prod}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super-secret-production-key-min-64-bytes-bangladesh-madrasaos}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - madrasa_uploads:/app/uploads
      - madrasa_logs:/app/logs
    networks:
      - madrasaos-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-madrasa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MadrasaSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-madrasaos_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_v3_schema.sql:/docker-entrypoint-initdb.d/001_v3_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madrasa_admin} -d ${POSTGRES_DB:-madrasaos_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - madrasaos-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-MadrasaRedisSecure2026!}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-MadrasaRedisSecure2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - madrasaos-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  madrasa_uploads:
    driver: local
  madrasa_logs:
    driver: local

networks:
  madrasaos-network:
    driver: bridge

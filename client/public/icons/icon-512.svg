<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Background (Vibrant Tiya / Parrot Green) -->
  <rect width="512" height="512" rx="110" fill="url(#grad)"/>
  
  <!-- Inner circular ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#dcfce7" stroke-width="8" opacity="0.3" />
  
  <!-- Minaret / Dome & Book Symbol -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Islamic Dome / Arch -->
    <path d="M256 100 C220 150 180 190 180 250 C180 290 214 320 256 320 C298 320 332 290 332 250 C332 190 292 150 256 100 Z" opacity="0.95"/>
    <!-- Crescent Star at top -->
    <path d="M256 75 A14 14 0 1 1 250 88 A11 11 0 1 0 256 75 Z" fill="#fef08a"/>
    <!-- Open Book / Rihal representation below -->
    <path d="M160 330 Q256 310 352 330 L370 380 Q256 360 142 380 Z" opacity="0.9"/>
    <path d="M256 325 L256 375" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Accent dots representing AI technology / nodes -->
  <circle cx="160" cy="180" r="10" fill="#86efac" />
  <circle cx="352" cy="180" r="10" fill="#86efac" />
  <circle cx="120" cy="280" r="8" fill="#4ade80" />
  <circle cx="392" cy="280" r="8" fill="#4ade80" />
  <line x1="160" y1="180" x2="200" y2="210" stroke="#86efac" stroke-width="3" stroke-dasharray="4,4"/>
  <line x1="352" y1="180" x2="312" y2="210" stroke="#86efac" stroke-width="3" stroke-dasharray="4,4"/>
</svg>
